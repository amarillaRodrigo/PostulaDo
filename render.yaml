services:
  - type: web
    name: postulado-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon: la URL con "-pooler" para la app y la directa para migrar.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Redis Cloud o Upstash: una sola URL, con TLS si es rediss://
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: CORS_ORIGINS
        value: https://rodrigoamarilla.tech,https://www.rodrigoamarilla.tech
      # Base pública de la landing: se usa para armar el enlace de verificación.
      - key: APP_PUBLIC_URL
        value: https://rodrigoamarilla.tech/postulado
      # Remitente del correo. El dominio tiene que estar verificado en Resend.
      - key: MAIL_FROM
        value: PostulaDo <no-reply@rodrigoamarilla.tech>
      # Sin esta clave la API funciona igual: no manda el mail y lo dice.
      - key: RESEND_API_KEY
        sync: false
